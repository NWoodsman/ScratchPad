services:
  scratchpad:
    image: ghcr.io/nwoodsman/scratchpad:latest
    container_name: scratchpad
    restart: unless-stopped
    ports:
      - "63001:63001"
      # To expose only on one interface (e.g. a Tailscale IP):
      # - "100.x.y.z:63001:63001"
    volumes:
      - scratchpad-data:/data

volumes:
  scratchpad-data:
